name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -o "$z"
          done

      - name: Find project dir
        run: |
          f=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          echo "Found: $f"
          echo "PROJECT_DIR=$(dirname "$f")" 

 
