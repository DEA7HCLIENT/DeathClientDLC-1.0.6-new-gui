name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip project
        run: |
          for z in *.zip; do unzip -oq "$z"; done

      - name: Find project
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "settings.gradle not found. Repo contents:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: NeverLoseBr0
          path: |
            ${{ env.DIR }}/build/libs/*.jar
            !${{ env.DIR }}/build/libs/*-sources.jar
