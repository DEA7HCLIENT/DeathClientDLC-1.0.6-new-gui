name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -o "$z"
          done

      - name: Find project dir
        run: |
          f=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          echo "Found: $f"
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
