name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip project
        run: unzip -oq "*.zip"

      - name: Fix repositories mode
        working-directory: NeverLoseBr0
        run: sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/' settings.gradle

      - name: Build
        working-directory: NeverLoseBr0
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NeverLoseBr0
          path: NeverLoseBr0/build/libs/*.jar
